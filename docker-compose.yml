services:
  database:
    build:
      context: ./db
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      CDSE_ID: ${CDSE_ID}
      CDSE_SECRET: ${CDSE_SECRET}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      UPLOAD_DIR: /app/uploads
      ASYNC_WORKERS: ${ASYNC_WORKERS:-4}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "Rscript -e 'if (httr2::resp_status(httr2::req_perform(httr2::request(\"http://localhost:8000/api/areas\"))) != 200) quit(status = 1)'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    depends_on:
      database:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
